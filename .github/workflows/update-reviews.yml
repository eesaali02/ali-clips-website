name: Update Google Reviews

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC (2am EST)
  workflow_dispatch:      # Allow manual trigger from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch reviews from Google Places API
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/fetch-reviews.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update reviews"
            git push
          else
            echo "No review changes to commit"
          fi
